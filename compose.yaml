services:
  graphdb:
    image: ontotext/graphdb:10.8.14
    container_name: plantms-graphdb
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - graphdb-home:/opt/graphdb/home
      - ./data:/opt/graphdb/import:ro
    command:
      - -Dgraphdb.home=/opt/graphdb/home
      - -Dgraphdb.workbench.importDirectory=/opt/graphdb/import

volumes:
  graphdb-home:
